version: 2

models:
  - name: rpt_monthly_metrics
    description: >
      Monthly transaction performance metrics for the Looker Studio
      dashboard. Grain is one row per calendar month containing transaction
      activity.

    columns:
      - name: month_start_date
        description: First calendar date of the reporting month.
        tests:
          - unique
          - not_null

      - name: avg_transaction_size
        description: Total monthly spend divided by monthly transaction count.
        tests:
          - not_null

      - name: active_accounts
        description: Distinct accounts with at least one transaction during the month.
        tests:
          - not_null

      - name: total_spend
        description: Sum of all transaction amounts during the month.
        tests:
          - not_null

      - name: transaction_count
        description: Number of transactions recorded during the month.
        tests:
          - not_null