version: 2

models:
  - name: dim_merchant
    columns:
      - name: merchant_id
        tests:
          - unique
          - not_null

  - name: dim_account
    columns:
      - name: account_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  - name: fct_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id

      - name: merchant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_id

      - name: date_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id